name: CI — Build Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build all images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front
          push: false
          tags: animal-platform-front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: animal-platform-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build scraper
        uses: docker/build-push-action@v5
        with:
          context: ./scraper
          push: false
          tags: animal-platform-scraper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

