name: CD — Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Auth AWS ───────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET }}
          aws-region: eu-west-1

      # ── 2. Démarre l'EC2 si elle est arrêtée ─────────────────────────────────
      - name: Start EC2 if stopped
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "State: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "Starting instance..."
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            echo "Instance running — waiting 30s for SSH daemon..."
            sleep 30
          fi

      # ── 3. Ouvre le port 22 uniquement pour cette IP de runner ────────────────
      - name: Allow SSH from runner
        id: sg
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          SG_ID=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].SecurityGroups[0].GroupId' \
            --output text)
          RUNNER_IP=$(curl -sf https://checkip.amazonaws.com)
          echo "Runner IP: $RUNNER_IP  |  SG: $SG_ID"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32"
          echo "sg_id=$SG_ID"     >> "$GITHUB_OUTPUT"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      # ── 4. Git pull + docker compose up --build ───────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Pa5emeAnn-e
            git pull origin main
            docker system prune -f
            bash pawmatch.sh deploy

      # ── 5. Ferme le port 22 (toujours, même si le deploy a planté) ────────────
      - name: Revoke SSH rule
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ steps.sg.outputs.sg_id }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.sg.outputs.runner_ip }}/32"

      # ── 6. Health check : attend que le front réponde ─────────────────────────
      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 25
          for i in $(seq 1 6); do
            if curl -sf --max-time 10 "http://${{ secrets.EC2_HOST }}:3000"; then
              echo "Frontend is up → http://${{ secrets.EC2_HOST }}:3000"
              exit 0
            fi
            echo "Attempt $i/6 — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 6 attempts"
          exit 1
