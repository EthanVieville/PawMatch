name: Scrape — Daily data pipeline

# ── Activation ────────────────────────────────────────────────────────────────
# Ce workflow est DÉSACTIVÉ par défaut (schedule commenté).
# Pour l'activer : GitHub → Actions → ce workflow → "Enable workflow"
# Pour le désactiver : même endroit → "Disable workflow"
# Pour un run manuel : "Run workflow" → renseigne la limite d'animaux
# ─────────────────────────────────────────────────────────────────────────────

on:
  # schedule:
  #   - cron: '0 6 * * *'   # Chaque jour à 6h UTC — décommenter pour activer
  workflow_dispatch:
    inputs:
      limit:
        description: 'Animaux max par source (La SPA + Seconde Chance)'
        required: false
        default: '30'

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape & process
    runs-on: ubuntu-latest

    steps:
      # ── 1. Auth AWS ─────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET }}
          aws-region: eu-west-1

      # ── 2. Démarre l'EC2 si elle est arrêtée ────────────────────────────────
      - name: Start EC2 if stopped
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "State: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "Starting instance..."
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            echo "Instance running — waiting 30s for SSH daemon..."
            sleep 30
          fi

      # ── 3. Ouvre le port 22 pour ce runner ──────────────────────────────────
      - name: Allow SSH from runner
        id: sg
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          SG_ID=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].SecurityGroups[0].GroupId' \
            --output text)
          RUNNER_IP=$(curl -sf https://checkip.amazonaws.com)
          echo "Runner IP: $RUNNER_IP  |  SG: $SG_ID"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32"
          echo "sg_id=$SG_ID"         >> "$GITHUB_OUTPUT"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      # ── 4. Pipeline : scraping → embeddings → refuges → rewrite ────────────
      - name: Run data pipeline
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/Pa5emeAnn-e
            LIMIT="${{ github.event.inputs.limit || '30' }}"
            echo "=== Pipeline démarré — limite : $LIMIT animaux par source ==="
            bash pawmatch.sh data $LIMIT
            echo "=== Pipeline terminé ==="

      # ── 5. Ferme le port 22 (toujours, même en cas d'erreur) ────────────────
      - name: Revoke SSH rule
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ steps.sg.outputs.sg_id }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.sg.outputs.runner_ip }}/32"
