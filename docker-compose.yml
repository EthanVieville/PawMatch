services:

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=pawmatch
      - POSTGRES_USER=pawmatch
      - POSTGRES_PASSWORD=pawmatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawmatch"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pawmatch:pawmatch@postgres:5432/pawmatch
      - ALLOWED_ORIGINS=http://localhost:3000
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      # En local uniquement — sur EC2 le IAM role prend le relais, pas besoin de ces vars
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Breed model — monté via volume, vide si non entraîné
      - BREED_MODEL_PATH=/app/models/pet_model_best.pth
    volumes:
      - ./dl_models/utils/out:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend Next.js ──────────────────────────────────────────────────────
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./front/public/uploads:/app/public/uploads
    depends_on:
      - api
    restart: unless-stopped

  # ── Scraper la-spa.fr (job ponctuel) ──────────────────────────────────────
  # docker compose --profile scraper run --rm scraper-laspa
  scraper-laspa:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://pawmatch:pawmatch@postgres:5432/pawmatch
      - SCRAPER_SOURCE=la-spa
      - MAX_PAGES=10                  # pages de listing (~20 animaux/page)
      - NUM_WORKERS=1
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scraper

  # ── Scraper secondechance.org (job ponctuel, requests-only — pas de Chrome) ─
  # docker compose --profile scraper run --rm scraper-sc
  # MAX_PAGES s'applique PAR espèce (chien/chat/lapin) : MAX_PAGES=3 ≈ 108 animaux
  scraper-sc:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://pawmatch:pawmatch@postgres:5432/pawmatch
      - SCRAPER_SOURCE=secondechance
      - MAX_PAGES=3                   # 3 pages × 3 espèces × ~12/page ≈ 108 animaux
      - NUM_WORKERS=1                 # Selenium : 1 Chrome par worker, 1 suffit sur t3.micro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - scraper

  # ── Embedder (calcul des vecteurs de similarité) ──────────────────────────
  # docker compose --profile embedder run --rm embedder
  # À lancer après chaque scraping pour mettre à jour les recommandations
  embedder:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://pawmatch:pawmatch@postgres:5432/pawmatch
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - embedder

  # ── Seeder (peuplement knowledge_chunks) ─────────────────────────────────
  # docker compose --profile seeder run --rm seeder
  # À lancer une fois, ou après modification du contenu dans seed_knowledge.py
  seeder:
    build:
      context: ./scripts
      dockerfile: Dockerfile.seeder
    environment:
      - DATABASE_URL=postgresql://pawmatch:pawmatch@postgres:5432/pawmatch
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - seeder

  # ── Rewriter (réécriture descriptions via Bedrock — après chaque scraping) ─
  # docker compose --profile rewriter run --rm rewriter
  # Limiter le nombre d'animaux : REWRITE_LIMIT=50 docker compose --profile rewriter run --rm rewriter
  rewriter:
    build:
      context: ./scripts
      dockerfile: Dockerfile.rewriter
    environment:
      - DATABASE_URL=postgresql://pawmatch:pawmatch@postgres:5432/pawmatch
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - REWRITE_LIMIT=${REWRITE_LIMIT:-}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - rewriter

  # ── Cleaner (validation URLs — supprime les animaux retirés des sources) ────
  # docker compose --profile cleanup run --rm cleaner
  # Lancé automatiquement en fin de pipeline data (bash pawmatch.sh data)
  cleaner:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://pawmatch:pawmatch@postgres:5432/pawmatch
      - CLEANUP_SOURCE=la-spa
    command: ["python", "cleanup.py"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - cleanup

  # ── Refuge Seeder (géocodage Nominatim — après chaque scraping) ──────────
  # docker compose --profile refuge-seeder run --rm refuge-seeder
  refuge-seeder:
    build:
      context: ./scripts
      dockerfile: Dockerfile.refuge-seeder
    environment:
      - DATABASE_URL=postgresql://pawmatch:pawmatch@postgres:5432/pawmatch
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - refuge-seeder

volumes:
  postgres_data:
